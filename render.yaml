services:
  - type: web
    name: ntuh-infection-control-line-bot
    env: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: KNOWLEDGE_DIR
        value: output/coze_upload
      - key: MAX_CONTEXT_CHARS
        value: 9000
      - key: MAX_LINE_REPLY_CHARS
        value: 4500
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
